<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcircNet™ — Circular Planetary Intelligence</title>
<meta name="description" content="EcircNet™ — Circular Planetary Intelligence. Built in Detroit. Built for What Comes Next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:   #0d0a2e;
  --gold: #E8B84B;
  --teal: #1d9e75;
  --text: #f0ece0;
  --muted: rgba(240,236,226,0.45);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.stage {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px 140px;
}

.ecircnet-svg {
  width: 160px;
  height: 160px;
  margin-bottom: 2.8rem;
  opacity: 0;
  animation: arrive 2.2s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
}

.name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(50px, 8.5vw, 84px);
  font-weight: 300;
  letter-spacing: 0.015em;
  color: var(--text);
  text-align: center;
  line-height: 1;
  margin-bottom: 0.5rem;
  opacity: 0;
  animation: arrive 1.8s 1.6s ease forwards;
}

.sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(14px, 2.2vw, 21px);
  font-weight: 300;
  font-style: italic;
  letter-spacing: 0.07em;
  color: var(--gold);
  text-align: center;
  margin-bottom: 2.8rem;
  opacity: 0;
  animation: arrive 1.8s 1.9s ease forwards;
}

.rule {
  width: 1px;
  height: 36px;
  background: linear-gradient(to bottom, transparent, rgba(232,184,75,0.5), transparent);
  margin-bottom: 2.4rem;
  opacity: 0;
  animation: arrive 1.8s 2.2s ease forwards;
}

.tagline {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin-bottom: 1.8rem;
  opacity: 0;
  animation: arrive 1.8s 2.5s ease forwards;
}

.contact {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--teal);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 1px;
  transition: border-color 0.25s ease;
  opacity: 0;
  animation: arrive 1.8s 2.8s ease forwards;
}

.contact:hover { border-color: var(--teal); }

/* ── TICKER ── */
.ticker-wrap {
  position: fixed;
  bottom: 52px;
  left: 0; right: 0;
  z-index: 10;
  overflow: hidden;
  opacity: 0;
  animation: arrive 1.8s 3.8s ease forwards;
}

.ticker-label {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 160px;
  display: flex;
  align-items: center;
  padding-left: 20px;
  background: linear-gradient(to right, #0d0a2e 70%, transparent);
  z-index: 2;
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  gap: 8px;
}

.ticker-label::before {
  content: '';
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 6px var(--teal);
  flex-shrink: 0;
  animation: blink 1.4s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.ticker-fade-right {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 80px;
  background: linear-gradient(to left, #0d0a2e 60%, transparent);
  z-index: 2;
}

.ticker-track {
  display: flex;
  width: max-content;
  animation: ticker-scroll 140s linear infinite;
  padding: 10px 0;
}

.ticker-track:hover { animation-play-state: paused; }

.ticker-item {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: rgba(240,236,226,0.95);
  white-space: nowrap;
  padding: 0 56px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.ticker-item .region {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.8;
  flex-shrink: 0;
}

.ticker-item .dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--teal);
  opacity: 0.6;
  flex-shrink: 0;
}

@keyframes ticker-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── FOOTER ── */
.foot {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 10px 32px;
  z-index: 10;
  border-top: 1px solid rgba(232,184,75,0.08);
  background: rgba(13,10,46,0.7);
  backdrop-filter: blur(8px);
  opacity: 0;
  animation: arrive 1.8s 3.4s ease forwards;
}

.foot span {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 300;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(240,236,226,0.35);
}

@keyframes arrive {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .ticker-label { width: 100px; font-size: 8px; }
  .ecircnet-svg { width: 110px; height: 110px; }
  .stage { padding-bottom: 160px; }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<main class="stage">

  <svg class="ecircnet-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-label="EcircNet closing loop mark">
    <line x1="72" y1="68"  x2="148" y2="68"  stroke="rgba(232,184,75,0.55)" stroke-width="7" stroke-linecap="round"/>
    <line x1="72" y1="110" x2="152" y2="110" stroke="rgba(232,184,75,0.55)" stroke-width="7" stroke-linecap="round"/>
    <line x1="72" y1="152" x2="148" y2="152" stroke="rgba(232,184,75,0.55)" stroke-width="7" stroke-linecap="round"/>
    <line x1="72" y1="68"  x2="72"  y2="152" stroke="rgba(232,184,75,0.55)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 155 75 A 68 68 0 1 0 155 145" fill="none" stroke="rgba(232,184,75,0.55)" stroke-width="7" stroke-linecap="round"/>
    <path id="closing-arc" d="M 155 145 A 68 68 0 0 0 155 75" fill="none" stroke="#e8b84b" stroke-width="7" stroke-linecap="round" stroke-dasharray="80" stroke-dashoffset="80"/>
    <circle cx="152" cy="110" r="13" fill="#1d9e75" opacity="0.9"/>
    <circle id="pulse-ring" cx="152" cy="110" r="13" fill="none" stroke="#1d9e75" stroke-width="2" opacity="0"/>
  </svg>

  <h1 class="name">EcircNet™</h1>
  <p class="sub">Circular Planetary Intelligence™</p>
  <div class="rule"></div>
  <p class="tagline">Built in Detroit &nbsp;·&nbsp; Built for What Comes Next</p>
  <a href="mailto:curt@detroitfamefactory.com" class="contact">curt@detroitfamefactory.com</a>

</main>

<!-- TICKER -->
<div class="ticker-wrap">
  <div class="ticker-label">Live Activity</div>
  <div class="ticker-fade-right"></div>
  <div class="ticker-track" id="ticker-track"></div>
</div>

<footer class="foot">
  <span>Patent Pending · Five Families</span>
  <span>UN Global Compact Signatory</span>
</footer>

<script>
// ── TICKER DATA ────────────────────────────────────────────────────────────
const ITEMS = [
  { region: "Michigan · USA",     text: "Dow Chemical acquires Circulus — adding 50,000MT recycled polyethylene capacity toward 3M MT/yr circular materials target by 2030" },
  { region: "Detroit · USA",      text: "General Motors commits to 50% sustainable material content across vehicle lineup and zero waste to landfill by 2030" },
  { region: "Dearborn · USA",     text: "Ford Motor Company advances zero-waste-to-landfill operations and circular materials recovery across global manufacturing" },
  { region: "West Africa",        text: "Ghana, Senegal, and Côte d'Ivoire launch joint circular agriculture initiative targeting 2M smallholder farmers by 2027" },
  { region: "East Africa",        text: "Kenya National Circular Economy Council certifies first blockchain-traced circular textile supply chains for export markets" },
  { region: "Nordic Bloc",        text: "Sitra Finland advances WCEF+ circular economy roadmap — 78% of Nordic enterprises now report circular KPIs against EU CSRD" },
  { region: "Netherlands",        text: "Amsterdam Doughnut Economy framework adopted by 240 businesses — Circle Economy reports €2.1B in circular transactions verified" },
  { region: "Brussels · EU",      text: "EU ESPR Digital Product Passport mandate enters enforcement phase — all product categories require circular traceability by 2026" },
  { region: "London · UK",        text: "London green bond market surpasses £40B — institutional demand for cryptographically verified circular impact claims accelerates" },
  { region: "Great Lakes · USA",  text: "Anishinaabe Three Fires Confederacy advances water stewardship protocols across Great Lakes basin — 10,000-year circular land ethic documented" },
  { region: "Tokyo · Japan",      text: "Keidanren SDG circular economy alignment report: 340 member companies now tracking circular material flows against 2030 targets" },
  { region: "Australia",          text: "Indigenous land stewardship circular economy models recognised by Australian government — circular agriculture leapfrog initiatives funded" },
  { region: "Girona · Spain",     text: "CircularPass deploys zero-knowledge supply chain verification for Celsa Group steel recycling — EU ESPR compliance pathway confirmed" },
  { region: "Delft · Netherlands",text: "Circularise ZK-proof traceability platform deployed with Porsche, Mitsubishi, and Marubeni — circular supply chain verification goes enterprise" },
  { region: "Sub-Saharan Africa", text: "African Union Agenda 2063 circular economy pillar advances — VERD-compatible agricultural impact verification frameworks under development" },
  { region: "Detroit · USA",      text: "Detroit industrial heritage anchors new circular manufacturing corridor — EV transition materials recovery programs expand across Michigan" },
  { region: "Seoul · Korea",      text: "Samsung and Hyundai publish first quantum-safe circular supply chain audit reports ahead of anticipated post-quantum regulatory standards" },
  { region: "São Paulo · Brazil", text: "Brazilian circular economy fund reaches $800M — fashion and aquaculture sectors leading verified circular impact investment" },
  { region: "Geneva · UNFCCC",    text: "Paris Agreement 1.5°C pathway report cites circular economy tokenomics as emerging mechanism for real-world carbon reduction verification" },
  { region: "New York · UNGC",    text: "UN Global Compact 20,000+ signatories report accelerating circular economy commitments — verification infrastructure identified as critical gap" },
];

function buildTicker() {
  const track = document.getElementById('ticker-track');
  const doubled = [...ITEMS, ...ITEMS];
  doubled.forEach(item => {
    const el = document.createElement('div');
    el.className = 'ticker-item';
    el.innerHTML = `<span class="region">${item.region}</span><span class="dot"></span>${item.text}`;
    track.appendChild(el);
  });
}

buildTicker();

// ── LIVING TESSELLATION ────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('bg');
  const ctx    = canvas.getContext('2d');
  let W, H, cells, fieldAngle;

  const HEX_SIZE  = 38;
  const ROT_SPEED = (Math.PI * 2) / (90 * 60);
  const CELL_ALPHA = 0.055;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildCells();
  }

  function buildCells() {
    cells = [];
    const s = HEX_SIZE;
    const w = s * Math.sqrt(3);
    const h = s * 2;
    const cols = Math.ceil((W + w * 4) / w) + 2;
    const rows = Math.ceil((H + h * 3) / (h * 0.75)) + 2;
    for (let row = -2; row < rows; row++) {
      for (let col = -2; col < cols; col++) {
        const offset = (row % 2) * (w / 2);
        cells.push({
          gx: col * w + offset - W * 0.5,
          gy: row * h * 0.75 - H * 0.5,
          phase: Math.random() * Math.PI * 2,
          speed: 0.003 + Math.random() * 0.004,
          vState: 0, vMax: 0,
        });
      }
    }
  }

  let lastVerify = 0, t = 0;

  function triggerVerification() {
    const c = cells[Math.floor(Math.random() * cells.length)];
    if (c.vState === 0) {
      c.vState = 0.001;
      c.vMax   = 0.55 + Math.random() * 0.25;
    }
  }

  function hexPath(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      i === 0 ? ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a))
              : ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    }
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    fieldAngle += ROT_SPEED;
    t++;
    if (t - lastVerify > 480 + Math.floor(Math.random() * 240)) {
      triggerVerification();
      lastVerify = t;
    }
    const cx = W / 2, cy = H / 2;
    for (const cell of cells) {
      cell.phase += cell.speed;
      const cos = Math.cos(fieldAngle), sin = Math.sin(fieldAngle);
      const rx = cell.gx * cos - cell.gy * sin + cx;
      const ry = cell.gx * sin + cell.gy * cos + cy;
      if (rx < -HEX_SIZE*2 || rx > W+HEX_SIZE*2 || ry < -HEX_SIZE*2 || ry > H+HEX_SIZE*2) continue;
      const breath = CELL_ALPHA + 0.022 * Math.sin(cell.phase);
      hexPath(rx, ry, HEX_SIZE);
      ctx.strokeStyle = `rgba(120,105,220,${breath*3})`;
      ctx.lineWidth = 0.5; ctx.stroke();
      hexPath(rx, ry, HEX_SIZE * 0.55);
      ctx.strokeStyle = `rgba(140,120,235,${breath*1.6})`;
      ctx.lineWidth = 0.4; ctx.stroke();
      if (cell.vState > 0) {
        if (cell.vState < cell.vMax) { cell.vState += 0.004; }
        else { cell.vState -= 0.002; if (cell.vState <= 0) cell.vState = 0; }
        const pulse = Math.max(0, Math.sin((cell.vState / cell.vMax) * Math.PI));
        if (pulse > 0.01) {
          const bloomR = HEX_SIZE * 0.8 * pulse;
          if (bloomR > 0.1) {
            const gr = ctx.createRadialGradient(rx, ry, 0, rx, ry, bloomR);
            gr.addColorStop(0,   `rgba(232,184,75,${0.22*pulse})`);
            gr.addColorStop(0.5, `rgba(232,184,75,${0.09*pulse})`);
            gr.addColorStop(1,   'rgba(232,184,75,0)');
            ctx.beginPath(); ctx.arc(rx, ry, bloomR, 0, Math.PI*2);
            ctx.fillStyle = gr; ctx.fill();
          }
          hexPath(rx, ry, HEX_SIZE);
          ctx.strokeStyle = `rgba(232,184,75,${0.32*pulse})`;
          ctx.lineWidth = 0.8; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  fieldAngle = 0; resize();
  requestAnimationFrame(draw);
})();

// ── ARC ANIMATION ─────────────────────────────────────────────────────────
(function(){
  const arc   = document.getElementById('closing-arc');
  const pulse = document.getElementById('pulse-ring');

  function animateArc(){
    arc.setAttribute('stroke-dashoffset', 80);
    let start = null;
    const easeOut = t => 1 - Math.pow(1-t, 3);
    function step(ts){
      if (!start) start = ts;
      const p = Math.min((ts-start)/3200, 1);
      arc.setAttribute('stroke-dashoffset', 80*(1-easeOut(p)));
      if (p < 1) { requestAnimationFrame(step); return; }
      arc.setAttribute('stroke-dashoffset', 0);
      let ps = null;
      pulse.setAttribute('opacity', '0.8');
      function pstep(ts2){
        if (!ps) ps = ts2;
        const pp = Math.min((ts2-ps)/700, 1);
        pulse.setAttribute('r', 13 + pp*22);
        pulse.setAttribute('opacity', 0.8*(1-pp));
        if (pp < 1) { requestAnimationFrame(pstep); return; }
        pulse.setAttribute('opacity', 0);
        pulse.setAttribute('r', 13);
        setTimeout(()=>animateArc(), 2500);
      }
      requestAnimationFrame(pstep);
    }
    requestAnimationFrame(step);
  }

  setTimeout(()=>animateArc(), 1800);
})();
</script>
</body>
</html>
